# SPDX-License-Identifier: Apache-2.0
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    # A branch with an open MR is covered by its MR pipeline; other branches get a push pipeline
    # whose branch-sbom jobs become dTrack versions named like the branch.
    - if: '$CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG =~ /^v\d+(\.\d+\.\d+)?$/'
    - when: never
stages: [test, build, prepare, scan, deploy]
# Dogfooding: one inventory per component of PatchWatch, see ci/components.yml.
include:
  - local: ci/components.yml
    rules:
      - if: '$PATCHWATCH_MR_FEEDBACK != "true"'
  - local: ci/mr-components.yml
    rules:
      - if: '$PATCHWATCH_MR_FEEDBACK != "true"'
  - local: ci/branch-components.yml
    rules:
      - if: '$PATCHWATCH_MR_FEEDBACK != "true"'
  - local: ci/release.yml
    rules:
      - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
  - local: ci/mr-feedback.yml
    inputs:
      image: $CI_REGISTRY_IMAGE/ci:$CI_COMMIT_SHA
# Feedback pipelines only run protected feedback jobs; other schedules run component scans.
.not-scheduled:
  rules:
    - if: '$PATCHWATCH_MR_FEEDBACK == "true"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - when: on_success
default:
  tags: [k3s, docker]
variables:
  KUBE_NAMESPACE: patchwatch

unit:
  rules: !reference [.not-scheduled, rules]
  stage: test
  image: python:3.14.0-alpine3.22
  before_script: ["apk add --no-cache bash git"]
  script:
    - pip install '.[ci]'
    - python -m unittest discover -s tests -v
    - python scripts/spdx.py --check
    - python -m patchwatch.dtrack.policies --check
    - python -m compileall -q patchwatch
    - sh -n deploy/compose/trivy-entrypoint.sh scripts/backup.sh scripts/helm-postrender.sh ci/install-tools.sh
    - bash -n scripts/install-agent.sh scripts/deploy.sh scripts/bootstrap-cluster.sh

manifests:
  rules: !reference [.not-scheduled, rules]
  stage: test
  image: alpine/k8s:1.36.0
  before_script: ['sh ci/install-tools.sh']
  script:
    - helm lint deploy/helm/patchwatch -f deploy/environments/infra.yaml
    - export BRIDGE_IMAGE=example.invalid/patchwatch:test
    - helmfile -f helmfile.yaml.gotmpl template > ci/rendered.yaml
    - helm template patchwatch deploy/helm/patchwatch --set monitor.enabled=true > ci/rendered-monitor.yaml
    - python3 ci/validate-yaml.py ci/rendered.yaml ci/rendered-monitor.yaml
    - cmp scripts/backup.sh deploy/helm/patchwatch/files/backup.sh
  artifacts:
    paths: [ci/rendered.yaml, ci/rendered-monitor.yaml]
    expire_in: 1 week

compose:
  rules: !reference [.not-scheduled, rules]
  stage: test
  image: docker:29.0.0-cli
  script:
    - docker compose --profile tls --profile operations --profile monitoring config --quiet

.docker-build:
  stage: build
  image: docker:29.0.0-cli
  services:
    - name: docker:29.0.0-dind
      alias: docker
      entrypoint: ['/bin/sh', '-c']
      command:
        - >-
          for cert in /etc/gitlab-runner/certs/*.crt; do
            [ -f "$cert" ] && cp "$cert" "/usr/local/share/ca-certificates/$(basename "$cert")";
          done;
          update-ca-certificates;
          exec dockerd-entrypoint.sh --tls=false ${DIND_INSECURE_REGISTRY:+--insecure-registry=$DIND_INSECURE_REGISTRY}
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ''

build:
  extends: .docker-build
  rules:
    - if: '$PATCHWATCH_MR_FEEDBACK == "true"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - printf '%s' "$CI_REGISTRY_PASSWORD" | docker login --username "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker build --pull --tag "$CI_REGISTRY_IMAGE/bridge:$CI_COMMIT_SHA" .
    - docker push "$CI_REGISTRY_IMAGE/bridge:$CI_COMMIT_SHA"
  artifacts:
    paths: [patchwatch.spdx.json]
    expire_in: 1 year

# Job image of ci-templates/sbom.yml. Release tags vX.Y.Z also publish :vX.Y.Z and the moving :vX.
build-ci-image:
  extends: .docker-build
  rules:
    - if: '$PATCHWATCH_MR_FEEDBACK == "true"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'  # branch-sbom jobs run this image
    - if: '$CI_COMMIT_TAG'
  script:
    - printf '%s' "$CI_REGISTRY_PASSWORD" | docker login --username "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker build --pull --file Dockerfile.ci --tag "$CI_REGISTRY_IMAGE/ci:$CI_COMMIT_SHA" .
    - docker push "$CI_REGISTRY_IMAGE/ci:$CI_COMMIT_SHA"
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        for tag in "$CI_COMMIT_TAG" "${CI_COMMIT_TAG%%.*}"; do
          docker tag "$CI_REGISTRY_IMAGE/ci:$CI_COMMIT_SHA" "$CI_REGISTRY_IMAGE/ci:$tag"
          docker push "$CI_REGISTRY_IMAGE/ci:$tag"
        done
      fi

# Installable agent packages (see docs/usage/agent.md). Release tags vX.Y.Z build them in ci/release.yml.
agent-packages:
  rules:
    - if: '$PATCHWATCH_MR_FEEDBACK == "true"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  stage: build
  image: python:3.14.0-alpine3.22
  script:
    - python packaging/build.py pyz
    - python packaging/build.py deb
  artifacts:
    paths: [dist/]
    expire_in: 1 year

deploy:
  stage: deploy
  image: alpine/k8s:1.36.0
  before_script: ['sh ci/install-tools.sh']
  resource_group: patchwatch-production
  environment:
    name: production
    url: $PUBLIC_URL
  rules:
    - if: '$PATCHWATCH_MR_FEEDBACK == "true"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - export BRIDGE_IMAGE="$CI_REGISTRY_IMAGE/bridge:$CI_COMMIT_SHA"
    - export COMPLIANCE_REPORT=ci/compliance-report.json
    # Installation-specific values (hostnames, OIDC issuer, private CA) live in a private repository.
    - git clone --depth 1 "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_FQDN}/${PATCHWATCH_ENV_PROJECT}.git" .env-private
    - export PATCHWATCH_ENV_DIR="$PWD/.env-private/environments"
    - bash scripts/deploy.sh
  artifacts:
    paths: [ci/compliance-report.json]
    when: always
    expire_in: 1 week
