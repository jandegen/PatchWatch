# SPDX-License-Identifier: Apache-2.0
storageClass: ''
imagePullSecrets: []
existingSecret: patchwatch-secrets
oidcTrust:
  enabled: false
  caPem: ""   # PEM of the private root CA; keep it out of this repository (see docs/installation/customization.md)
postgresql:
  image: postgres:17.7-alpine
  storage: 40Gi
  resources:
    requests: {cpu: 250m, memory: 512Mi}
    limits: {memory: 1Gi}
bridge:
  image: patchwatch-bridge:local
  storage: 1Gi
  minimumSeverity: HIGH
  # CISA KEV and FIRST EPSS enrichment; needs outbound HTTPS to www.cisa.gov and api.first.org
  # (or internal mirrors via kevUrl / epssUrl).
  enrichment:
    enabled: true
    kevUrl: https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json
    epssUrl: https://api.first.org/data/v1/epss
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {memory: 256Mi}
backup:
  enabled: true
  schedule: '15 1 * * *'
  storage: 20Gi
  retentionDays: 14
monitor:
  enabled: false
  schedule: '0 7 * * *'
  maxAgeHours: 48
  existingSecret: patchwatch-monitor-key
versions:
  enabled: true
  schedule: '*/5 * * * *'
  existingSecret: patchwatch-versions-key
networkPolicy:
  enabled: true
trivy:
  enabled: true
  image: aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb
  existingSecret: patchwatch-trivy
  storage: 4Gi
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: '1', memory: 1536Mi}
