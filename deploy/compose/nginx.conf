server {
    listen 8080;
    server_tokens off;
    client_max_body_size 128m;
    location /api/ { proxy_pass http://apiserver:8080; proxy_read_timeout 300s; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
    location / { proxy_pass http://frontend:8080; proxy_set_header Host $host; }
    location /health { return 404; }
    location /mirror { return 404; }
}
