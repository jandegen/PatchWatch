# SPDX-License-Identifier: Apache-2.0
server {
    listen 8443 ssl;
    server_tokens off;
    ssl_certificate /run/secrets/tls.crt;
    ssl_certificate_key /run/secrets/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 128m;
    location /api/ { proxy_pass http://apiserver:8080; proxy_read_timeout 300s; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; }
    location / { proxy_pass http://frontend:8080; proxy_set_header Host $host; }
    location /health { return 404; }
    location /mirror { return 404; }
}
