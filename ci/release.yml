# Release pipeline: runs for tags vX.Y.Z only. See docs/operations/release.md.
#   verify-release -> release-bridge-image, release-packages, release-pkg-macos (optional)
#   -> release (GitLab release with asset links) -> mirror-github
#   -> release-github-images (bridge and CI image to ghcr.io), release-github (GitHub Release with assets)
#   release-sbom-parent (prepare), release-sbom-bridge, release-sbom-ci-image (scan): upload the released images to PatchWatch/dTrack
#   as version vX.Y.Z (profile distribution, delta report against the previous release). The third-party
#   images (sbom-* in ci/components.yml) run on tags too. release-sbom-project writes one CycloneDX SBOM of the
#   whole project (repository + all images) that the release lists as an asset.
# CI/CD variables: PATCHWATCH_MACOS_RUNNER=true (enables the .pkg job, needs a runner tagged "macos"),
# GITHUB_MIRROR_URL and GITHUB_MIRROR_TOKEN (both optional; without them the GitHub jobs are skipped),
# GITHUB_GHCR_TOKEN (optional; without it the bridge and CI image are not published to ghcr.io).

# Release inventories in PatchWatch (Dependency-Track): one version vX.Y.Z per own image, so the release
# shows up with licences, vulnerabilities, policy result and the delta to the previous release.
# allow_failure: a dTrack outage must not block the release, the GitHub mirror or the assets.
# The parent project must exist per version (parentName + parentVersion), so the tag pipeline creates
# it first, in an earlier stage than the component jobs.
include:
  - local: ci-templates/sbom.yml
    inputs:
      job_name: release-sbom-parent
      stage: prepare
      image: $CI_REGISTRY_IMAGE/ci:$CI_COMMIT_SHA
      mode: parent
      allow_failure: true
      run_if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/ && $PATCHWATCH_MR_FEEDBACK != "true" && $CI_PIPELINE_SOURCE != "schedule"
  - local: ci-templates/sbom.yml
    inputs:
      job_name: release-sbom-bridge
      stage: scan
      image: $CI_REGISTRY_IMAGE/ci:$CI_COMMIT_SHA
      component: bridge
      scan_paths: ''
      bsi_mode: report  # same as sbom-bridge in ci/components.yml
      images: $CI_REGISTRY_IMAGE/bridge:$CI_COMMIT_SHA
      allow_failure: true
      run_if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/ && $PATCHWATCH_MR_FEEDBACK != "true" && $CI_PIPELINE_SOURCE != "schedule"
  - local: ci-templates/sbom.yml
    inputs:
      job_name: release-sbom-ci-image
      stage: scan
      image: $CI_REGISTRY_IMAGE/ci:$CI_COMMIT_SHA
      component: ci-image
      scan_paths: ''
      bsi_mode: report
      images: $CI_REGISTRY_IMAGE/ci:$CI_COMMIT_SHA
      allow_failure: true
      run_if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/ && $PATCHWATCH_MR_FEEDBACK != "true" && $CI_PIPELINE_SOURCE != "schedule"

# Tag pipelines run the third-party scans of ci/components.yml as well; like the release-sbom-* jobs they
# must not block the release when Dependency-Track is unavailable (later include wins over components.yml).
sbom-dtrack-apiserver: {allow_failure: true}
sbom-dtrack-frontend: {allow_failure: true}
sbom-postgres: {allow_failure: true}
sbom-trivy: {allow_failure: true}
sbom-gateway: {allow_failure: true}

.release-rules:
  rules:
    - if: '$PATCHWATCH_MR_FEEDBACK == "true"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'

verify-release:
  stage: test
  rules: !reference [.release-rules, rules]
  image: python:3.14.0-alpine3.22
  script:
    - version="${CI_COMMIT_TAG#v}"
    - test "$(python -c 'from patchwatch import __version__; print(__version__)')" = "$version"
    - grep -q "^version = \"$version\"$" pyproject.toml

release-bridge-image:
  extends: .docker-build
  stage: build
  rules: !reference [.release-rules, rules]
  needs: [verify-release]
  script:
    - printf '%s' "$CI_REGISTRY_PASSWORD" | docker login --username "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - version="${CI_COMMIT_TAG#v}"
    - docker build --pull --label "org.opencontainers.image.version=$version" --label "org.opencontainers.image.revision=$CI_COMMIT_SHA" --tag "$CI_REGISTRY_IMAGE/bridge:$version" .
    - for tag in "${version%.*}" latest "$CI_COMMIT_SHA"; do docker tag "$CI_REGISTRY_IMAGE/bridge:$version" "$CI_REGISTRY_IMAGE/bridge:$tag"; done
    - docker push --all-tags "$CI_REGISTRY_IMAGE/bridge"

release-packages:
  stage: build
  rules: !reference [.release-rules, rules]
  needs: [verify-release]
  image: python:3.14.0-alpine3.22
  script:
    - apk add --no-cache curl git
    - PACKAGE_URL="$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/patchwatch-agent/${CI_COMMIT_TAG#v}"
    - export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
    - python packaging/build.py pyz
    - python packaging/build.py deb
    - (cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS)
    - |
      for file in dist/*; do
        curl --fail --silent --show-error --header "JOB-TOKEN: $CI_JOB_TOKEN" \
          --upload-file "$file" "$PACKAGE_URL/$(basename "$file")"
      done
  artifacts:
    paths: [dist/]
    expire_in: 1 year

# Needs a macOS runner tagged "macos" (shell executor with Xcode command line tools); enable with
# PATCHWATCH_MACOS_RUNNER=true. The .pkg is not signed or notarized here.
release-pkg-macos:
  stage: build
  tags: [macos]
  rules:
    - if: '$PATCHWATCH_MACOS_RUNNER != "true"'
      when: never
    - !reference [.release-rules, rules]
  needs: [verify-release]
  script:
    - PACKAGE_URL="$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/patchwatch-agent/${CI_COMMIT_TAG#v}"
    - export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
    - python3 packaging/build.py pkg --output dist-macos
    - (cd dist-macos && shasum -a 256 *.pkg > SHA256SUMS-macos)
    - |
      for file in dist-macos/*; do
        curl --fail --silent --show-error --header "JOB-TOKEN: $CI_JOB_TOKEN" \
          --upload-file "$file" "$PACKAGE_URL/$(basename "$file")"
      done
  artifacts:
    paths: [dist-macos/]
    expire_in: 1 year

# One CycloneDX 1.6 SBOM for the whole project: repository dependencies plus the own images and every
# third-party image of compose.yaml in a single document (no upload; Dependency-Track gets the per-component
# versions above). Required for the release: a release without its SBOM is incomplete.
release-sbom-project:
  stage: scan
  rules: !reference [.release-rules, rules]
  image: $CI_REGISTRY_IMAGE/ci:$CI_COMMIT_SHA  # no needs: the stage order guarantees build-ci-image and the bridge image are done
  timeout: 30m
  variables:
    PATCHWATCH_SCAN_PATHS: .
    PATCHWATCH_BSI_MODE: report  # Alpine base packages lack concluded licences, see sbom-bridge
    PATCHWATCH_SBOM_OUTPUT: patchwatch-sbom.cdx.json
  script:
    - |
      third_party="$(python - <<'PY'
      import re
      text = open("compose.yaml").read()
      images = dict.fromkeys(m for m in re.findall(r"^\s+image: ['\"]?([^\s'\"$]+)", text, re.M) if "patchwatch" not in m)
      print(" ".join(images))
      PY
      )"
      test -n "$third_party"
    - export PATCHWATCH_IMAGES="$CI_REGISTRY_IMAGE/bridge:$CI_COMMIT_SHA $CI_REGISTRY_IMAGE/ci:$CI_COMMIT_SHA $third_party"
    - echo "Images:$PATCHWATCH_IMAGES"
    - cd /opt/patchwatch && python -m patchwatch.ci --dry-run
  artifacts:
    paths: [patchwatch-sbom.cdx.json, patchwatch-bsi-report.json]
    when: always
    expire_in: never

release:
  stage: deploy
  rules: !reference [.release-rules, rules]
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - release-bridge-image
    - release-packages
    - release-sbom-project
    - job: release-pkg-macos
      optional: true
  script:
    - |
      version="${CI_COMMIT_TAG#v}"
      base="$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/patchwatch-agent/$version"
      links=""
      for name in patchwatch-agent.pyz "patchwatch-agent_${version}_all.deb" SHA256SUMS; do
        links="$links --assets-link {\"name\":\"$name\",\"url\":\"$base/$name\"}"
      done
      sbom="$CI_PROJECT_URL/-/jobs/artifacts/$CI_COMMIT_TAG/raw/patchwatch-sbom.cdx.json?job=release-sbom-project"
      links="$links --assets-link {\"name\":\"patchwatch-sbom.cdx.json\",\"url\":\"$sbom\",\"link_type\":\"other\"}"
      if [ "$PATCHWATCH_MACOS_RUNNER" = "true" ]; then
        for name in "patchwatch-agent-$version.pkg" SHA256SUMS-macos; do
          links="$links --assets-link {\"name\":\"$name\",\"url\":\"$base/$name\"}"
        done
      fi
      # shellcheck disable=SC2086
      release-cli create --name "PatchWatch $CI_COMMIT_TAG" --tag-name "$CI_COMMIT_TAG" \
        --description "Bridge image: $CI_REGISTRY_IMAGE/bridge:$version. Agent packages and the project SBOM (CycloneDX 1.6) are listed as assets; checksums in SHA256SUMS." \
        $links

# The GitLab history is never pushed. Each release becomes one commit in the GitHub repository, made from
# the tagged tree (git archive), after a scan for installation-specific strings. Needs the CI/CD variables
# GITHUB_MIRROR_URL, GITHUB_MIRROR_TOKEN and MIRROR_FORBIDDEN_PATTERNS (extended regex, e.g. your domain and
# GitLab user names; kept in the variable because the strings must not appear in this repository).
mirror-github:
  stage: deploy
  rules:
    - if: '$GITHUB_MIRROR_URL == null || $GITHUB_MIRROR_TOKEN == null'
      when: never
    - !reference [.release-rules, rules]
  needs: [release]
  image:
    name: alpine/git:latest
    entrypoint: [""]
  script:
    - test -n "$MIRROR_FORBIDDEN_PATTERNS" || { echo "MIRROR_FORBIDDEN_PATTERNS is required"; exit 1; }
    - mkdir snapshot && git archive "$CI_COMMIT_SHA" | tar -x -C snapshot
    - |
      if grep -rIiE -l "$MIRROR_FORBIDDEN_PATTERNS" snapshot; then
        echo "Installation-specific data found in the files above; refusing to mirror."; exit 1
      fi
    - auth="$(printf 'x-access-token:%s' "$GITHUB_MIRROR_TOKEN" | base64 | tr -d '\n')"
    - |
      git -c "http.extraHeader=Authorization: Basic $auth" clone "$GITHUB_MIRROR_URL" mirror
    - cd mirror
    - git rm -rq --ignore-unmatch . && cp -a ../snapshot/. .
    - git add -A
    - git -c user.name="Patchwatch contributors" -c user.email="noreply@invalid" commit --allow-empty -q -m "Release $CI_COMMIT_TAG"
    - git tag "$CI_COMMIT_TAG"
    - |
      git -c "http.extraHeader=Authorization: Basic $auth" push origin HEAD "refs/tags/$CI_COMMIT_TAG"

.github-rules:
  rules:
    - if: '$GITHUB_MIRROR_URL == null || $GITHUB_MIRROR_TOKEN == null'
      when: never
    - !reference [.release-rules, rules]

# Copies the released images (same digest, no rebuild) from the GitLab registry to ghcr.io/<owner>/<repo>/bridge
# and .../ci (the job image of ci-templates/sbom.yml, so others can include the CI templates with it).
# Needs GITHUB_GHCR_TOKEN (classic PAT, write:packages; ghcr.io does not accept fine-grained tokens). Content,
# config and manifest of each image are scanned against MIRROR_FORBIDDEN_PATTERNS first, nothing is pushed on
# a hit. The first push creates each package as private: set it to public once and link it to the repository.
release-github-images:
  stage: deploy
  rules:
    - if: '$GITHUB_GHCR_TOKEN == null'
      when: never
    - !reference [.github-rules, rules]
  needs: [mirror-github, release-bridge-image, build-ci-image]
  image:
    name: gcr.io/go-containerregistry/crane:debug
    entrypoint: [""]
  script:
    - test -n "$MIRROR_FORBIDDEN_PATTERNS" || { echo "MIRROR_FORBIDDEN_PATTERNS is required"; exit 1; }
    - slug="${GITHUB_MIRROR_URL#https://github.com/}"; slug="${slug%.git}"; slug="$(echo "$slug" | tr 'A-Z' 'a-z')"
    - version="${CI_COMMIT_TAG#v}"
    - printf '%s' "$CI_REGISTRY_PASSWORD" | crane auth login "$CI_REGISTRY" --username "$CI_REGISTRY_USER" --password-stdin
    # Release tags of the bridge image are X.Y.Z, X.Y, latest; of the CI image vX.Y.Z and vX (see build-ci-image).
    - bridge_tags="$version ${version%.*} latest $CI_COMMIT_SHA"
    - ci_tags="$CI_COMMIT_TAG ${CI_COMMIT_TAG%%.*} $CI_COMMIT_SHA"
    - |
      for name in bridge ci; do
        mkdir "rootfs-$name"
        crane export "$CI_REGISTRY_IMAGE/$name:$CI_COMMIT_SHA" - | tar -x -C "rootfs-$name"
        crane config "$CI_REGISTRY_IMAGE/$name:$CI_COMMIT_SHA" > "rootfs-$name/.image-config.json"
        crane manifest "$CI_REGISTRY_IMAGE/$name:$CI_COMMIT_SHA" > "rootfs-$name/.image-manifest.json"
        if grep -raiE -l "$MIRROR_FORBIDDEN_PATTERNS" "rootfs-$name"; then
          echo "Installation-specific data found in the files above; refusing to publish the $name image."; exit 1
        fi
      done
    - printf '%s' "$GITHUB_GHCR_TOKEN" | crane auth login ghcr.io --username x-access-token --password-stdin
    - |
      for tag in $bridge_tags; do crane copy "$CI_REGISTRY_IMAGE/bridge:$CI_COMMIT_SHA" "ghcr.io/$slug/bridge:$tag"; done
      for tag in $ci_tags; do crane copy "$CI_REGISTRY_IMAGE/ci:$CI_COMMIT_SHA" "ghcr.io/$slug/ci:$tag"; done

# GitHub Release for the tag the mirror pushed: agent packages, checksums and the project SBOM. With
# GITHUB_GHCR_TOKEN set, internal registry names in the SBOM are replaced by the public ghcr.io names (both
# images then resolve on ghcr.io; project, commit and pipeline links point to GitHub). Files are scanned against
# MIRROR_FORBIDDEN_PATTERNS first, see scripts/publish-github-release.py. The macOS .pkg is not published.
release-github:
  stage: deploy
  rules: !reference [.github-rules, rules]
  needs:
    - mirror-github
    - release-packages
    - release-sbom-project
    - job: release-github-images
      optional: true
  image: python:3.14.0-alpine3.22
  script:
    - version="${CI_COMMIT_TAG#v}"
    - slug="${GITHUB_MIRROR_URL#https://github.com/}"; slug="${slug%.git}"; slug="$(echo "$slug" | tr 'A-Z' 'a-z')"
    - path="${GITHUB_MIRROR_URL#https://github.com/}"; path="${path%.git}"
    - notes="Agent packages and the project SBOM (CycloneDX 1.6). Checksums in SHA256SUMS."
    - set --
    - |
      if [ -n "$GITHUB_GHCR_TOKEN" ]; then
        notes="Bridge image: ghcr.io/$slug/bridge:$version. $notes"
        set -- --rewrite "$CI_REGISTRY_IMAGE=ghcr.io/$slug" --rewrite "$CI_REGISTRY=ghcr.io"
      fi
    # The SBOM carries the GitLab project, commit and pipeline links; the order matters (specific before general).
    - |
      set -- "$@" --rewrite "$CI_PROJECT_URL/-/commit/=https://github.com/$path/commit/" \
        --rewrite "$CI_PIPELINE_URL=https://github.com/$path/releases/tag/$CI_COMMIT_TAG" \
        --rewrite "$CI_PROJECT_URL=https://github.com/$path" --rewrite "$CI_PROJECT_PATH=$path"
    - python scripts/publish-github-release.py --tag "$CI_COMMIT_TAG" --name "PatchWatch $CI_COMMIT_TAG" --notes "$notes" "$@" dist/* patchwatch-sbom.cdx.json
